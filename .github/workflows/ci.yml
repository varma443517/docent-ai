# Lint + unit tests on every push and PR. No model is installed here on purpose:
# tests must pass with FakeLLM only, so they are fast, free and deterministic.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: make lint
      - run: make test
